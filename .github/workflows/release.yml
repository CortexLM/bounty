name: release

# An annotated tag vX.Y.Z aliases the already tested and attested sha-<commit>
# digest to vX.Y.Z and stable. Nothing is rebuilt, so the attestation still applies.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/cortexlm/bounty
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check tag, version and main ancestry
        id: check
        run: |
          # checkout can rewrite the pushed tag as lightweight; fetch the real object.
          git fetch --no-tags origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must be vX.Y.Z"; exit 1; }
          [ "$(git cat-file -t "refs/tags/${TAG}")" = tag ] || { echo "tag must be annotated"; exit 1; }
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          [ "v${version}" = "$TAG" ] || { echo "pyproject version ${version} != ${TAG}"; exit 1; }
          commit=$(git rev-parse "${TAG}^{commit}")
          git merge-base --is-ancestor "$commit" origin/main || { echo "tag is not on main"; exit 1; }
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Alias the tested digest
        env:
          COMMIT: ${{ steps.check.outputs.commit }}
        run: |
          source="${IMAGE}:sha-${COMMIT}"
          digest=$(docker buildx imagetools inspect "$source" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$digest" == sha256:* ]] || { echo "no image for ${source}; wait for images.yml"; exit 1; }
          # --prefer-index=false keeps a single-manifest source byte-identical, so the
          # digest (and its provenance attestation) is unchanged.
          docker buildx imagetools create --prefer-index=false \
            --tag "${IMAGE}:${TAG}" --tag "${IMAGE}:stable" "${IMAGE}@${digest}"
          for tag in "$TAG" stable; do
            moved=$(docker buildx imagetools inspect "${IMAGE}:${tag}" --format '{{json .Manifest}}' | jq -r .digest)
            [ "$moved" = "$digest" ] || { echo "${tag} resolved to ${moved}, expected ${digest}"; exit 1; }
          done
          echo "DIGEST=${digest}" >> "$GITHUB_ENV"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes=$(awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)
          printf '%s\n\nImage: %s@%s (tags %s and stable).\n' \
            "$notes" "$IMAGE" "$DIGEST" "$TAG" > release-notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release-notes.md
