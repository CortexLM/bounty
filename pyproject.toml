[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "bounty-challenge"
version = "1.0.0"
description = "Cortex Bounty challenge container: report intake and valid-report weights"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.135,<0.136",
  "httpx>=0.28,<0.29",
  "pydantic>=2.12,<3",
  "py-sr25519-bindings>=0.2.3,<0.3",
  "uvicorn>=0.41,<0.42",
]

[project.urls]
Source = "https://github.com/CortexLM/bounty"

[project.scripts]
bounty-challenge = "bounty_challenge.cli:main"

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2", "ruff>=0.15,<0.16", "mypy>=1.19,<2"]
build = ["hatchling>=1.27,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/bounty_challenge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
files = ["src/bounty_challenge"]
strict = true

[[tool.mypy.overrides]]
module = ["sr25519"]
ignore_missing_imports = true
